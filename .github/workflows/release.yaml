name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install dependencies
        run: yarn install

      - name: Generate changelog file
        uses: rhysd/changelog-from-release/action@v3
        with:
          github_token: ${{ secrets.PAT }}
          file: packages/healthicons-flutter/CHANGELOG.md
          commit: false
          args: -d=false

      - name: Build
        run: yarn run build

      - name: Prepare packages
        run: yarn run prepublish-all
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Commit release
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Release Version ${{ github.ref_name }} [skip ci]
          branch: main

      - name: Update tag
        run: |
          git -c user.email="actions@github.com" -c user.name="GitHub Actions" tag -fa ${{ github.ref_name }} -m "${{ github.ref_name }}"
          git push -f origin ${{ github.ref_name }}

      - name: Set .npmrc
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish npm packages
        run: |
          FAILED=0
          for pkg in healthicons-react healthicons-react-native healthicons-vue; do
            LOG=$(mktemp)
            if (cd "packages/$pkg" && npm publish) >"$LOG" 2>&1; then
              echo "Published $pkg"
              cat "$LOG"
            elif grep -q "previously published versions" "$LOG"; then
              echo "$pkg is already published at this version, skipping"
            else
              echo "::error::Publishing $pkg failed"
              cat "$LOG"
              FAILED=1
            fi
          done
          exit $FAILED
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Publish Flutter package
        run: |
          mkdir -p ~/.pub-cache
          echo '${{ secrets.PUB_CREDENTIAL_JSON }}' > ~/.pub-cache/credentials.json
          cd packages/healthicons-flutter
          flutter pub publish --force
